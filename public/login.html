<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – Medwell PACE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="landing.html" aria-label="Medwell PACE home">
        <span class="logo-mark"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21.5l8.8-8.8a5 5 0 0 0 0-7.1z"/></svg></span>
        <span>Medwell <span class="logo-pace">PACE</span></span>
      </a>
      <a class="back-link" href="landing.html">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>
        <span>Back<span class="back-text-long"> to home</span></span>
      </a>
    </div>
  </header>

  <main id="main" class="auth-main">
    <div class="card auth-card">
      <div class="auth-head">
        <div class="auth-icon"><svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
        <h1>Welcome back</h1>
        <p class="lead">Log in to your PACE account.</p>
      </div>

      <!-- Shown when the server says the email or password is wrong. Call showLoginError() -->
      <div class="alert alert-error" id="login-error" role="alert" hidden>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <p><strong>We couldn't log you in.</strong><br>Please check your email and password and try again.</p>
      </div>

      <!-- BACK END: connect this form to the login API (fields: email, password, remember) -->
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required>
          <p class="field-error" id="email-error" hidden></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="toggle-pw" type="button" data-target="password" aria-pressed="false" aria-label="Show password">Show</button>
          </div>
          <p class="field-error" id="password-error" hidden></p>
        </div>

        <div class="row field">
          <label class="check">
            <input type="checkbox" id="remember" name="remember">
            <span>Keep me logged in</span>
          </label>
          <a href="reset-password.html">Forgot password?</a>
        </div>

        <button class="btn btn-primary btn-block" type="submit" id="login-btn">Log in</button>
      </form>

      <div class="auth-foot">
        <p>New to PACE?</p>
        <a class="btn btn-secondary btn-block" href="signup.html">Create an account</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Medwell Solutions</p>
      <nav class="footer-links" aria-label="Footer">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
        <a href="#">Help &amp; Support</a>
      </nav>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    (function () {
      var form = document.getElementById('login-form');
      var email = document.getElementById('email');
      var password = document.getElementById('password');
      var button = document.getElementById('login-btn');
      var errorBox = document.getElementById('login-error');

      // Call this from the back-end response when the login fails.
      window.showLoginError = function () {
        errorBox.hidden = false;
        button.disabled = false;
        button.textContent = 'Log in';
        password.value = '';
        password.focus();
      };

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorBox.hidden = true;

        var firstBad = null;
        if (!email.value.trim()) {
          PACE.setError(email, 'Please enter your email address.'); firstBad = email;
        } else if (!PACE.isEmail(email.value)) {
          PACE.setError(email, 'Please enter a full email address, like name@example.com.'); firstBad = email;
        } else {
          PACE.setError(email, '');
        }

        if (!password.value) {
          PACE.setError(password, 'Please enter your password.'); firstBad = firstBad || password;
        } else {
          PACE.setError(password, '');
        }

        if (firstBad) { firstBad.focus(); return; }

        button.disabled = true;
        button.textContent = 'Logging in…';

        // BACK END: replace this demo with the real login request.
        // On success:  window.location.href = 'dashboard.html';
        // On failure:  showLoginError();
        setTimeout(function () {
          button.disabled = false;
          button.textContent = 'Log in';
        }, 1200);
      });
    })();
  </script>
</body>
</html>
